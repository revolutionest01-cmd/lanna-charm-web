server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.html;

    # Cache busting for versioned assets
    location ~* ^/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache public assets
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webmanifest|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
